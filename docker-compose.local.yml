# 本地源码构建覆盖文件（自用部署）
#
# 作用：不用上游 ghcr 镜像，而是用**当前目录这份源码**构建镜像。
# 用法（在仓库根目录）：
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# 或者更简单：把下面这行写进 .env，之后直接用 `docker compose up -d --build`
#   COMPOSE_FILE=docker-compose.yml:docker-compose.local.yml
#
# 说明：
# - 不覆盖 PASSWORD 等环境变量，仍由 docker-compose.yml + .env 提供；
# - 镜像名改为本地标签 libretv-local:latest，避免与上游镜像名冲突，
#   也避免误以为自己在跑官方最新版；
# - 端口、容器名、重启策略全部沿用 docker-compose.yml。
services:
  libretv:
    # 强制用当前源码构建（docker-compose.yml 里的 build: . 仍然生效，这里显式声明意图）
    build:
      context: .
      dockerfile: Dockerfile
    # 本地镜像标签：构建产物只存在于本机，不推送到任何 registry
    image: libretv-local:latest
